# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App - function-app4253bdad

on:
  push:
    branches:
      - azure-coursework
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
      id-token: write #This is required for requesting the JWT


    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          corepack: yarn
          cache: yarn

      - name: Install Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FDF1400B3AD84CE5ADEE40F490097E4C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F4B15379219E415CAE7C3E7BAEEFE327 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4055B9E0C15148E495917898E414FBCA }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build frontend
        working-directory: packages/frontend
        run: yarn build
        env: 
          VITE_API_URL: TODO
          VITE_CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }}
          VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          VITE_MEDIA_CONTAINER_URL: TODO

      - name: Pull SST state
        run: bash ./scripts/download_sst_state.sh
        env:
          SST_STAGE: production
          AZURE_STORAGE_ACCOUNT: brightideacistate
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY_BRIGHTIDEACISTATE }}

      - name: Deploy to production
        run: yarn sst deploy
        env:
          CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          AUTH0_MANAGEMENT_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_MANAGEMENT_CLIENT_ID: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_ID }}
          AUTH0_MANAGEMENT_CLIENT_SECRET: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}
          DEPLOYMENT_USER_PRINCIPAL_TYPE: ServicePrincipal
          SST_STAGE: production

      - name: Store SST state
        run: bash ./scripts/store_sst_state.sh
        env:
          SST_STAGE: production
          AZURE_STORAGE_ACCOUNT: brightideacistate
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY_BRIGHTIDEACISTATE }}

      - name: Deploy backend
        working-directory: packages/backend
        run: yarn deploy
